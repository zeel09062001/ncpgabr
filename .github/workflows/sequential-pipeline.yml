name: Sequential CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ==========================================
  # JOB 1: BUILD STAGE
  # ==========================================
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Artifacts
        run: |
          echo "Compiling application code..."
          echo "Build complete successfully!"

  # ==========================================
  # JOB 2: TEST STAGE (Requires 'build')
  # ==========================================
  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build # 👈 FORCES SEQUENTIAL EXECUTION: Waits for 'build' job to complete
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Automated Unit Tests
        run: |
          echo "Running test suite..."
          node app.test.js

  # ==========================================
  # JOB 3: DEPLOY STAGE (Requires 'test')
  # ==========================================
  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: [build, test] # 👈 DEPENDENCY LIST: Requires BOTH 'build' and 'test' to pass
    steps:
      - name: Deploy to Cloud / Production
        run: |
          echo "Deploying application to production environment..."
          echo "Deployment successful!"
