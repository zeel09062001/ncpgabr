name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using your repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and push the image to your Docker Hub account
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Note: This automatically uses your username and names the image 'my-homework-app'
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-homework-app:latest
